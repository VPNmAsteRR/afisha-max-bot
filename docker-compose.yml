services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./credentials.json:/app/credentials.json:ro
    environment:
      - DATA_DIR=/app/data
      - GOOGLE_CREDENTIALS=/app/credentials.json
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
